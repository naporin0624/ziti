[package]
name = "ziti"
version = "0.1.0"
edition = "2021"
description = "Recognize the playing song via songrec and forward it as an OSC string"

[[bin]]
name = "ziti"
path = "src/main.rs"

[lib]
name = "ziti"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rosc = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
dialoguer = "0.11"

[dev-dependencies]
rusty-hook = "0.11"
